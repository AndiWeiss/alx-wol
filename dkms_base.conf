# gets sourced by dkms.conf

AUTOINSTALL="yes"
PRE_BUILD="scripts/fetchsources.sh $install_tree"

if [ "$0" != "/usr/sbin/dkms" ]; then
	gitcall="$source_tree/$PACKAGE_NAME-$PACKAGE_VERSION/scripts/gitcall.sh"
	${gitcall} -C replace_by_path fetch
else
	build="${dkms_tree}/${module}/${module_version}/build"

	# check if module shall be installed or removed
	if [ "${module}" != "" ]; then
		# it shall be installed

		orig_loc="${install_tree}/${kernelver}${DEST_MODULE_LOCATION[0]}"
		new_loc="${install_tree}/${kernelver}$(override_dest_module_location "${DEST_MODULE_LOCATION[0]}")"
		POST_INSTALL="scripts/handleinitrd.sh \"${kernelver}\" install \"$orig_loc\" \"$new_loc\""
		POST_REMOVE="scripts/handleinitrd.sh \"${kernelver}\" remove \"$orig_loc\" \"$new_loc\""

		# get the script for selecting the compiler to use
		select_compiler="${source_tree}/${module}-${module_version}/scripts/select_compiler.sh"
		detect_version="${source_tree}/${module}-${module_version}/scripts/detect_version.sh"

		# get compiler line from config
		compiler_line=$(grep CONFIG_CC_VERSION_TEXT $install_tree/$kernelver/build/include/config/auto.conf)
		result="$(${detect_version} "${compiler_line}")"

		# get the compiler type used
		compiler_type_used="$(echo "${result}" | sed 's| .*$||')"
		compiler_version_used="$(echo "${result}" | sed 's|^.* ||')"

		# in case of clang additional parameters are required
		if [ "${compiler_type_used}" = "clang" ]; then
			add_flags="LLVM=1 LLVM_IAS=1"
		fi

		# get the path to the working directory
		temp="${dkms_tree}/${module}/${module_version}/${kernelver}"

		# get the compiler to use
		compiler_exe="$("${select_compiler}" "${arch}" "${build}" "${compiler_type_used}" "${compiler_version_used}")"

		# set the make command line
		MAKE[0]="make -C \"$kernel_source_dir\" M=\"$dkms_tree/$module/$module_version/build\" HOSTCC=\"${compiler_exe}\" CC=\"${compiler_exe}\" ${add_flags}"
	fi
fi
